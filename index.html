<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bug-free-octo-couscous</title>
    <style>
        body {
            background: radial-gradient(circle at center, #1e293b 0%, #020617 100%);
            color: white;
            font-family: system-ui, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        h1 {
            letter-spacing: -1px;
            background: linear-gradient(90deg, #00f2fe 0%, #4facfe 100%);
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        img {
            border-radius: 15px;
            filter: grayscale(20%);
            transition: 0.5s;
        }
        img:hover {
            filter: grayscale(0%);
            box-shadow: 0 0 20px #4facfe;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>bug-free-octo-couscous</h1>
        <img src="bug-free-octo-couscous.png" width="300" alt="Octo-Couscous">
        <p style="opacity: 0.6; margin-top: 20px;">100% tasty.</p>
    </div>
</body>
</html>
